name: Build & Run with ngrok Tunnel

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'ngrok auth token (để trống sẽ dùng secret NGROK_AUTH_TOKEN)'
        required: false
        type: string
      run_duration:
        description: 'Thời gian chạy tunnel (phút)'
        required: false
        default: '60'
        type: string

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.run_duration || 60) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Build
        run: go build -o youtube-subtitle-burner .

      - name: Run server (background)
        run: |
          nohup ./youtube-subtitle-burner > server.log 2>&1 &
          echo "Server PID: $!"
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8988/ || true

      # --- THAY THẾ ACTION NGROK BẰNG CÁCH CÀI ĐẶT THỦ CÔNG ---
      - name: Download and Setup ngrok
        env:
          NGROK_AUTHTOKEN: ${{ github.event.inputs.ngrok_token || secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Tải và giải nén ngrok
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          
          # Cấu hình auth token
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          echo "ngrok setup complete."

      - name: Start ngrok tunnel
        run: |
          # Chạy ngrok ở chế độ nền
          nohup ngrok http 8988 --log stdout > ngrok.log 2>&1 &
          echo "Waiting for tunnel to be established..."
          sleep 5
          
          # In URL công khai từ log (ngrok v3 log ra stdout)
          grep -o 'https://[a-z0-9-]*\.ngrok-free\.app' ngrok.log | head -n 1 || echo "URL not found in log yet, check ngrok.log"
          
          # In toàn bộ log để dự phòng
          echo "=== ngrok log ==="
          cat ngrok.log

      - name: Show public URL
        run: |
          echo "=== ngrok tunnel đã mở ==="
          # Thử lấy URL từ API local của ngrok (cổng 4040)
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' || echo "Không lấy được URL từ API, xem log ở bước trước."

      - name: Keep alive
        run: |
          echo "Tunnel đang chạy. Thời gian: ${{ github.event.inputs.run_duration || 60 }} phút"
          sleep $(( ${{ github.event.inputs.run_duration || 60 }} * 60 ))
